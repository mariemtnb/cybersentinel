# Mandatory CI: runs on every pull request and on pushes to main/develop/feature branches.
# Every job is offline and deterministic (recorded API responses), so a temporary outage of
# NVD/CISA/OSV/EPSS can never make CI red — and a broken pipeline can never make it green.
# Live API checks are in smoke.yml, separately.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Unit and integration tests (offline)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (full pipeline on recorded responses, includes dbt build + tests)
        run: pytest tests/integration -q

  contracts:
    name: Data contracts (datacontract-cli)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Separate job: datacontract-cli pins its own DuckDB version.
      - run: pip install "datacontract-cli[duckdb,parquet]==1.2.10"
      - name: Lint every contract (ODCS schema)
        run: for c in contracts/*.yaml; do datacontract lint "$c" || exit 1; done
      - name: Test every contract against its fixture server
        run: for c in contracts/*.yaml; do echo "== $c"; datacontract test "$c" --server ci || exit 1; done

  dbt:
    name: dbt parse, build and test on fixture data
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt && pip install -e .
      - name: dbt parse (project compiles, refs and sources resolve)
        working-directory: warehouse
        run: python -m dbt.cli.main parse --project-dir . --profiles-dir .
      - name: Load recorded responses and run dbt build (models + snapshot + all tests)
        # The replay run validates, loads, runs `dbt build` and fails if any dbt test fails.
        run: python -m cybersentinel run --replay
      - name: Show the published result
        run: |
          python - <<'EOF'
          import duckdb
          con = duckdb.connect("data-replay/published/cybersentinel.duckdb", read_only=True)
          print(con.sql("select priority_tier, count(*) n from marts.fct_vulnerabilities group by 1 order by 1"))
          EOF

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cybersentinel:ci .
      - name: Image can import the package and dbt
        run: docker run --rm cybersentinel:ci python -c "import cybersentinel, dbt.adapters.duckdb, prefect, streamlit; print('ok')"
      - run: docker compose config --quiet
