version: 2

models:
  - name: stg_cisa_kev
    description: CISA KEV entries currently in the catalog.
    columns:
      - name: cve_id
        data_tests: [unique, not_null]
  - name: stg_nvd_cves
    description: NVD CVEs with typed fields.
    columns:
      - name: cve_id
        data_tests: [unique, not_null]
      - name: cvss_severity
        data_tests:
          - accepted_values:
              arguments:
                values: ["NONE", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
  - name: stg_nvd_cpe_matches
    description: Distinct vulnerable vendor/product pairs per CVE.
  - name: stg_osv_vulnerabilities
    columns:
      - name: osv_id
        data_tests: [unique, not_null]
  - name: stg_osv_affected_ranges
  - name: stg_watchlist_packages
    columns:
      - name: package_key
        data_tests: [unique, not_null]
  - name: stg_watchlist_matches
    columns:
      - name: match_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["affected", "not_affected", "unverified"]
      - name: package_key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_watchlist_packages')
                field: package_key
  - name: stg_epss_scores
    data_tests:
      - unique_combination:
          arguments:
            columns: [cve_id, score_date]
    columns:
      - name: epss_score
        data_tests: [not_null]
  - name: stg_pipeline_runs
  - name: stg_source_runs
