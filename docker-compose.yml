# CyberSentinel local platform: `docker compose up`
#
#   object-store    S3-compatible object store (SeaweedFS) for the raw layer — same API as AWS S3
#   prefect-server  Prefect API + UI (http://localhost:4200): schedules and run history
#   pipeline        runs the pipeline once at start-up, then daily at 06:00 UTC (Prefect)
#   dashboard       Streamlit dashboard (http://localhost:8501), reads the published warehouse
#
# Data: the DuckDB warehouse, the published copy and the ops state live in the `cs-data`
# volume; raw snapshots live in the object store (`object-data` volume). Secrets come from .env.
name: cybersentinel

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CYBERSENTINEL_DATA_DIR: /app/data
  RAW_STORAGE: s3
  S3_BUCKET: ${S3_BUCKET:-cybersentinel-lake}
  S3_ENDPOINT_URL: http://object-store:8333
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cybersentinel}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}

services:
  object-store:
    # The course suggests MinIO, but MinIO's community Docker images are no longer published
    # (docker.io/minio/minio no longer exists). SeaweedFS exposes the same S3 API, so the
    # pipeline code is unchanged and moving to AWS S3 is still "change one address".
    image: chrislusf/seaweedfs:4.54
    command: server -dir=/data -s3 -s3.port=8333 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cybersentinel}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (see .env.example)}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3.9.3-python3.12
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pipeline:
    build: .
    image: cybersentinel:local
    command: python -m orchestration.serve
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect-server:4200/api
      PIPELINE_CRON: ${PIPELINE_CRON:-0 6 * * *}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-true}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_BACKFILL_DAYS: ${NVD_BACKFILL_DAYS:-7}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - cs-data:/app/data
      - ./config:/app/config:ro      # edit the watchlist / scoring rules without rebuilding
    depends_on:
      object-store:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: cybersentinel:local
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - cs-data:/app/data:ro
    depends_on:
      pipeline:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cs-data:
  object-data:
  prefect-data:
