# Software watchlist — the packages CyberSentinel monitors through OSV.
#
# These are DEMONSTRATION assets chosen to exercise the platform (several old versions with
# known advisories, two of them affected by vulnerabilities listed in CISA KEV). They are not
# a description of any real organisation's infrastructure.
#
# Edit this file to monitor your own dependencies — no code change is needed. Each entry needs:
#   name       package name as published in its ecosystem (Maven: "group:artifact")
#   ecosystem  OSV ecosystem name: PyPI, npm, Maven, Go, RubyGems, NuGet, crates.io, Packagist
#   version    the exact version deployed
#   owner      (optional) the team responsible, shown in the dashboard
packages:
  - name: Django
    ecosystem: PyPI
    version: 4.2.0
    owner: web-platform
  - name: Flask
    ecosystem: PyPI
    version: 2.3.0
    owner: internal-tools
  - name: requests
    ecosystem: PyPI
    version: 2.28.0
    owner: internal-tools
  - name: Jinja2
    ecosystem: PyPI
    version: 3.1.2
    owner: web-platform
  - name: urllib3
    ecosystem: PyPI
    version: 1.26.5
    owner: data-team
  - name: express
    ecosystem: npm
    version: 4.18.0
    owner: frontend
  - name: lodash
    ecosystem: npm
    version: 4.17.20
    owner: frontend
  - name: axios
    ecosystem: npm
    version: 0.21.1
    owner: frontend
  - name: org.apache.logging.log4j:log4j-core
    ecosystem: Maven
    version: 2.14.1
    owner: legacy-billing
  - name: org.springframework:spring-beans
    ecosystem: Maven
    version: 5.3.17
    owner: legacy-billing
